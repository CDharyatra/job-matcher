# =============================================================================
# config.yaml — non-secret system configuration. Safe to commit (no PII here).
# Secrets live in .env. Personal form facts live in candidate_facts.yaml.
# =============================================================================

search:
  # Titles you want. The intent-expander adds synonyms automatically.
  target_titles:
    - "Machine Learning Engineer"
    - "Python Developer"
  # Keep must-haves to the ONE universal non-negotiable. Every missing must-have
  # hard-caps a job below 70, so a long list would wrongly discard good Python
  # roles that simply don't mention RAG/GenAI.
  must_have_skills: [Python]
  nice_to_have_skills:
    - "Machine Learning"
    - "RAG"
    - "LangChain"
    - "LangGraph"
    - "FastAPI"
    - "PostgreSQL"
    - "pgvector"
    - "AWS"
    - "Bedrock"
    - "Docker"
    - "REST API"
    - "Redis"
    - "SQL"
  negative_keywords:
    - "wordpress"
    - "php"
    - "intern"
    - "internship"
    - "unpaid"
    - "data entry"
    - "telesales"
    - "customer support"
  experience_min: "2"
  experience_max: "4"
  # Both spellings: postings use "Bengaluru" and "Bangalore" interchangeably.
  locations: [Bengaluru, Bangalore]
  # One lens per target title, each using only resume-true skills. A Python web
  # role is judged as a Python role (not as a failed ML role) and vice versa;
  # the job keeps the better of its track scores.
  tracks:
    - title: "Machine Learning Engineer"
      skills: ["Machine Learning", "RAG", "LangChain", "LangGraph", "FastAPI",
               "PostgreSQL", "pgvector", "AWS", "Bedrock", "Docker", "REST API",
               "Redis", "SQL", "TensorFlow", "PyTorch", "Microservices"]
    - title: "Python Developer"
      skills: ["Python", "SQL", "FastAPI", "Flask", "REST API", "PostgreSQL",
               "MySQL", "Redis", "Docker", "Git", "Pytest", "JWT", "RBAC",
               "WebSockets", "Streamlit", "Linux", "CI/CD", "Microservices"]
  # Hybrid preference: remote roles are down-weighted, not excluded, and no
  # dedicated remote query is issued. Flip to true if you want remote-first.
  remote_ok: false
  # Recency ladder: try 24h first, widen automatically if the feed is thin.
  date_posted_ladder_hours: [24, 48, 168]   # 24h -> 48h -> 7 days
  max_pages_per_query: 5
  # Detail pages opened per run (newest first). Each is one paced page view;
  # details fill title/company/description/apply-type, without which the
  # scorer cannot judge and auto-apply can never trigger.
  max_details_per_run: 100
  daily_collection_cap_per_platform: 500
  min_results_before_widening: 15

routing:
  discard_below: 70             # < 70 -> discarded, no apply, no email
  inbox_above: 90              # > 90 -> inbox even if Easy Apply exists
  # 70..90 inclusive -> auto-apply when in-platform apply and all facts present
  min_pay_lpa: 19.0             # keep undisclosed pay + disclosed >= 19 LPA

platforms:
  # Collection order. ATS first (pure HTTPS, no browser), then Naukri: its
  # pages are lighter and its session check doubles as an early
  # browser-health signal.
  order: [ats, naukri, linkedin]
  linkedin:
    enabled: true
    easy_apply_pass: true       # dedicated pass with Easy Apply filter
    all_jobs_pass: true         # pass without the filter so external jobs can be emailed
  naukri:
    enabled: true
    in_platform_only_for_apply: true
    freshness_days: [1]         # Last 1 day only — never widen (stale inbox fix)
  ats:
    enabled: true
    max_age_days: 30             # drop board reposts older than this
    # Curated product-company boards (public APIs, no auth, no browser).
    # Jobs route to inbox with direct apply links; never auto-applied.
    # Salary is not published by these APIs: the ~20 LPA bar stays a human
    # call at inbox review.
    companies:
      - {provider: greenhouse, board: rzr, company: RZR}
      - {provider: greenhouse, board: skildai-careers, company: Skild AI}
      - {provider: greenhouse, board: enterpret, company: Enterpret}
      - {provider: lever, board: neuron7, company: Neuron7}
      - {provider: lever, board: levelai, company: Level AI}
      - {provider: ashby, board: spector-ai, company: Spector.ai}
      - {provider: ashby, board: wisdom-ai, company: Wisdom AI}
      - {provider: ashby, board: nightfall-ai, company: Nightfall AI}

apply:
  # Max ACTUAL submits per platform per UTC day. Qualifying jobs beyond the
  # cap are deferred (retried tomorrow), never silently dropped, never emailed
  # as a substitute. Conservative; raise gradually after the precision gate.
  daily_auto_apply_cap_per_platform: 3
  min_seconds_between_applies: 90          # human-like pacing
  min_seconds_between_actions: 4
  quiet_hours:                              # local time, 24h
    start: "7:00"
    end: "08:00"
  live_submit_enabled: true              # MUST stay false until precision gate + user OK
  precision_gate: 0.80                      # min auto-apply precision on the golden set

email:
  digest_enabled: true
  send_daily_summary_even_if_zero: true
  # OFF: score web-collected jobs only. Turn on only if live collection is
  # blocked and you want job-alert mail parsed as fallback intake.
  alert_intake_enabled: false
  # Max job packets per digest section. Beyond this, only the best (score,
  # then recency) ship; the rest stays unmarked and competes again next run.
  # Failed applies always ship in full. Keeps the digest readable AND lossless.
  max_packet_emails_per_run: 25

browser:
  # Dedicated Chrome profile — the user logs in here by hand, once.
  chrome_path: "C:/Program Files/Google/Chrome/Application/chrome.exe"
  user_data_dir: "./.browser/profile"
  remote_debugging_port: 9222
  headless: false
  attach_mode: "cdp"                        # "cdp" or "persistent" (Playwright-owned)
  slow_mo_ms: 50
  navigation_timeout_ms: 45000

llm:
  enabled: true                             # false => deterministic-only mode
  daily_call_budget_per_model: 300          # conservative; NVIDIA free tier is undocumented
  # Tight timeouts: a stalled endpoint must fail fast into failover, not burn
  # minutes per model (measured: 60s x retries x chain = 7+ min per job).
  max_retries: 1
  backoff_base_seconds: 2
  request_timeout_seconds: 45
  # Groq free tier: ~8K tokens/min shared per model; one judge prompt eats most
  # of it, so pace calls instead of 429-cascading into weaker models.
  provider_min_interval_seconds:
    groq_free: 40.0
  prompt_version: "v1"
  # Allowlist only. Paid model ids are refused by the policy module.
  # Order follows MEASURED responsiveness first, quality second (2026-10-08):
  # Groq answers in seconds (qwen verified 0.9s); NVIDIA stalls for minutes;
  # OpenRouter :free takes 350-650s per call, so it is OUT of the judge chain
  # (kept configured for overflow only if ever needed). Circuit breaker +
  # tight timeouts bound any stall. Re-run `eval` after any reorder.
  judge_chain:
    - provider: groq_free
      model: "qwen/qwen3.8-27b"
    # NOTE: groq gpt-oss-120b removed from the JUDGE chain 2026-10-08: it
    # scored 80 on a discard-worthy consultancy posting (AA intel 23.8 — too
    # weak for nuanced fit). It stays in classify_chain where speed matters.
    - provider: opencode_zen
      model: "space-bunny-free"
    - provider: nvidia
      model: "deepseek-ai/deepseek-v4.1-flash"
    - provider: nvidia
      model: "moonshotai/kimi-k3"
    - provider: nvidia
      model: "nvidia/nemotron-3-ultra-550b-a55b"
    - provider: groq_free
      model: "openai/gpt-oss-120b"
  classify_chain:
    - provider: nvidia
      model: "nvidia/nemotron-3.5-lightning-30b-a3b"
    - provider: nvidia
      model: "nvidia/nemotron-3-ultra-550b-a55b"
    - provider: groq_free
      model: "openai/gpt-oss-120b"
    - provider: nvidia
      model: "mistralai/mistral-7b-instruct-v0.3"
  long_context_chain:
    - provider: nvidia
      model: "moonshotai/kimi-k3"
    - provider: nvidia
      model: "deepseek-ai/deepseek-v4.1-flash"

# Cross-encoder rerank scoring: the primary relevance signal (fast + accurate).
# Order: most generous free API first, Cohere trial last as audit reserve.
# Missing keys/deps fail soft instantly. Confirm model ids on the provider's
# dashboard if one 404s — hosted ids rotate.
rerank:
  enabled: true
  daily_budget_per_model: 1000
  borderline_lo: 60.0
  borderline_hi: 93.0
  chain:
    - provider: jina
      model: "jina-reranker-v2-base-multilingual"
    - provider: voyage
      model: "rerank-2.5-lite"
    - provider: local_bge
      model: "BAAI/bge-reranker-v2-m3"
    - provider: cohere
      model: "rerank-v3.5"

storage:
  sqlite_path: "./data/jobagent.sqlite3"
  cache_dir: "./data/cache"
  log_dir: "./data/logs"

scheduler:
  run_times: ["09:15", "14:15", "20:15"]    # local times for Task Scheduler runs

blocklist:
  companies: []                             # e.g. [Some Consultancy Pvt Ltd]
  keywords: []                              # e.g. [ghost posting, 100% commission]